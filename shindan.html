<main class="w"><h1>副業モデル診断</h1><div id="quiz" class="quiz"><p class="sub">5つの質問に答えると、図鑑の中からあなたに合いそうなビジネスの型を3つ選びます。結果は参考の目安です。</p>

<style>.quiz{display:grid;gap:12px}.qq{font-weight:600;margin:6px 0}.qo{display:grid;gap:8px}.qo button{font:inherit;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.qo button:hover,.qo button:focus-visible{border-color:var(--accent);outline:none}.qp{font-size:.8rem;color:var(--sub)}.qr{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);margin:8px 0}

<script>(function(){var D={"questions": [{"q": "副業に使える時間は、1週間にどれくらい?", "options": [{"label": "5時間未満", "points": {"alternatives-seo": 2, "template-shop": 3}}, {"label": "5〜10時間", "points": {"alternatives-seo": 2, "template-shop": 2, "newsletter-sponsorship": 2, "niche-job-board": 1, "product-launch-directory": 1}}, {"label": "10時間以上", "points": {"niche-job-board": 2, "product-launch-directory": 2, "business-marketplace": 2, "hn-163788e9": 2, "hn-194d666a": 2, "hn-6e9432ff": 2}}]}, {"q": "いちばん得意なことは?", "options": [{"label": "文章を書く", "points": {"alternatives-seo": 3, "newsletter-sponsorship": 2}}, {"label": "人と話す・頼みごとをする", "points": {"niche-job-board": 3, "business-marketplace": 2, "newsletter-sponsorship": 2, "product-launch-directory": 1}}, {"label": "調べて整理する", "points": {"alternatives-seo": 2, "product-launch-directory": 2, "business-marketplace": 1}}, {"label": "形のあるものを作る", "points": {"template-shop": 3, "hn-163788e9": 2, "hn-194d666a": 2, "hn-6e9432ff": 3}}]}, {"q": "どんな形でお金を受け取りたい?", "options": [{"label": "毎月決まって入る", "points": {"hn-163788e9": 3, "hn-194d666a": 3, "niche-job-board": 1, "hn-6e9432ff": 3}}, {"label": "売れるたびに入る", "points": {"template-shop": 3, "business-marketplace": 2}}, {"label": "広告や紹介料で入る", "points": {"alternatives-seo": 3, "newsletter-sponsorship": 2, "product-launch-directory": 2, "niche-job-board": 2}}]}, {"q": "最初にかけられるお金は?", "options": [{"label": "0円", "points": {"template-shop": 2, "alternatives-seo": 1, "newsletter-sponsorship": 1}}, {"label": "数千円まで", "points": {"alternatives-seo": 2, "niche-job-board": 2, "product-launch-directory": 2, "newsletter-sponsorship": 1, "hn-6e9432ff": 2}}, {"label": "1万円以上でもよい", "points": {"business-marketplace": 2, "hn-163788e9": 2, "hn-194d666a": 2}}]}, {"q": "プログラミングは?", "options": [{"label": "やったことがない", "points": {"alternatives-seo": 2, "template-shop": 2, "newsletter-sponsorship": 2}}, {"label": "少しならできる", "points": {"niche-job-board": 2, "product-launch-directory": 2, "business-marketplace": 1}}, {"label": "得意", "points": {"hn-163788e9": 3, "hn-194d666a": 3, "product-launch-directory": 1, "hn-6e9432ff": 3}}]}], "items": {"alternatives-seo": {"title": "「○○の代替」比較サイト", "summary": "人気サービスの代替先を比較する検索流入型のサイト。海外ではAlternativeTo型の比較サイトが定番。", "difficulty": "低", "model": "アフィリエイト・広告"}, "niche-job-board": {"title": "ニッチ求人ボード", "summary": "特定の職種や働き方に絞り、企業が掲載料を払う求人サイト。", "difficulty": "中", "model": "掲載料"}, "product-launch-directory": {"title": "個人開発の新作お披露目サイト", "summary": "新作サービスを披露し、投票・コメントで注目を集める掲載型サイト。", "difficulty": "中", "model": "掲載料・広告"}, "business-marketplace": {"title": "小規模サイト・事業の売買マーケット", "summary": "個人が運営するサイトやSaaSを売買する仲介サイト。", "difficulty": "高", "model": "成約手数料(海外例のFlippaは売却額に応じて売り手から3〜10%)"}, "newsletter-sponsorship": {"title": "メルマガの広告枠マーケット", "summary": "個人のニュースレターと広告主をつなぐ仲介サービス。", "difficulty": "中", "model": "成約手数料"}, "template-shop": {"title": "業種別テンプレートの販売店", "summary": "Notionやスプレッドシートなどのテンプレートを、業種別にそろえて販売する。", "difficulty": "低", "model": "単品販売"}, "hn-194d666a": {"title": "出資なしで育てる企業向けセキュリティ製品", "summary": "社内ネットワークに「わな」を置き、侵入者が触れたら知らせる製品を、外部出資なしで年間継続収入1100万ドルまで育てた例。", "difficulty": "高", "model": "年額サブスクリプション(法人向け)"}, "hn-163788e9": {"title": "開発者向けのデータ収集API", "summary": "Webページの情報を自動で集める機能をAPIとして月額で提供し、2人の創業者が出資なしで約2年で年間継続収入100万ドルに到達した例。", "difficulty": "高", "model": "月額サブスクリプション(利用量別の料金)"}, "hn-6e9432ff": {"title": "1人で複数の小さなSaaSを低コストで運営する", "summary": "図や文書を作るWebツールなど、用途の絞られた小さな有料サービスを1人で複数運営する型。サーバー1台・少ない部品で固定費を抑え、利益を残しやすくする。", "difficulty": "中", "model": "月額サブスクリプション(サービスごと)"}}, "prefix": "lab/", "share": "https://naginata-work.github.io/mijoriku-lab/shindan.html"};var i=0,score={};var box=document.getElementById("qbox"),res=document.getElementById("qres");
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function ask(){var Q=D.questions[i];box.innerHTML='<div class="qp">質問 '+(i+1)+' / '+D.questions.length+'</div><div class="qq">'+esc(Q.q)+'</div><div class="qo">'+Q.options.map(function(o,k){return '<button type="button" data-k="'+k+'">'+esc(o.label)+'</button>'}).join("")+'</div>';}
box.addEventListener("click",function(ev){var b=ev.target.closest("button[data-k]");if(!b)return;var p=D.questions[i].options[+b.dataset.k].points;for(var s in p){score[s]=(score[s]||0)+p[s]}i++;if(i<D.questions.length){ask()}else{show()}});
function show(){box.hidden=true;var top=Object.keys(D.items).map(function(s){return [s,score[s]||0]}).sort(function(a,b){return b[1]-a[1]}).slice(0,3);
var html='<h2>あなたに合いそうなビジネスの型</h2>'+top.map(function(t,n){var it=D.items[t[0]];var name=D.prefix?'<a href="'+D.prefix+t[0]+'.html">'+esc(it.title)+'</a>':esc(it.title);return '<div class="qr"><div class="rk">'+(n+1)+'位</div><h3>'+name+'</h3><div class="sub">'+esc(it.summary)+'</div><div class="sub">難易度 '+esc(it.difficulty)+'・'+esc(it.model)+'</div></div>'}).join("");
var first=D.items[top[0][0]].title;var text='副業モデル診断の結果、私に合うのは「'+first+'」でした';
html+='<div class="qa"><button type="button" id="qagain">もう一度診断する</button>';if(D.share){html+='<a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(D.share)+'">結果をXで共有</a>'}html+='</div>';
res.innerHTML=html;res.hidden=false;document.getElementById("qagain").onclick=function(){i=0;score={};res.hidden=true;box.hidden=false;ask()};}
ask();})();</script></main>
